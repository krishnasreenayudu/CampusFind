# ---------------------------------------------------------------
#  CampusFind database settings  (EDIT db.user and db.password)
# ---------------------------------------------------------------
db.host=localhost
db.port=3306
db.name=campusfind
db.user=root
db.password=CHANGE_ME

# Leave these two as they are for MySQL
db.scheme=mysql
db.params=useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=LOCAL

# true  = on first run, add demo students, items and an admin so you can
#         demonstrate the project immediately (only runs while there are no students)
# false = start with just the admin account
seed.demo=true
